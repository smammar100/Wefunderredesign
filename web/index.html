<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tuff Design System</title>
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <!-- The landing faces, fetched with the page so headings don't reflow when they land. -->
    <link rel="preload" href="/landing/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/landing/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The theme before the first paint: a stated preference, or the machine's. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <style>
      html { background: #f5f5f7; }
      html[data-theme='dark'] { background: #090909; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
